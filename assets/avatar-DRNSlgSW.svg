<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#001a00"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="200" height="240" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="200" height="240" fill="url(#bg)"/>
    <!-- Subtle grid -->
    <line x1="0" y1="80" x2="200" y2="80" stroke="#00ff41" stroke-width="0.4" opacity="0.1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#00ff41" stroke-width="0.4" opacity="0.1"/>
    <line x1="67" y1="0" x2="67" y2="240" stroke="#00ff41" stroke-width="0.4" opacity="0.1"/>
    <line x1="133" y1="0" x2="133" y2="240" stroke="#00ff41" stroke-width="0.4" opacity="0.1"/>

    <!-- Shirt / body -->
    <path d="M0 240 L0 188 Q8 168 38 158 Q64 150 100 148 Q136 150 162 158 Q192 168 200 188 L200 240Z" fill="#111111"/>
    <!-- Shirt collar V -->
    <path d="M84 148 L100 170 L116 148" fill="#0d0d0d"/>

    <!-- Long hair back — left side -->
    <path d="M57 82 Q44 105 43 148 Q43 188 52 220 L72 210 Q65 180 66 148 Q66 115 76 92Z" fill="#1e0f08"/>
    <!-- Long hair back — right side -->
    <path d="M143 82 Q156 105 157 148 Q157 188 148 220 L128 210 Q135 180 134 148 Q134 115 124 92Z" fill="#1e0f08"/>

    <!-- Neck -->
    <rect x="84" y="142" width="32" height="18" fill="#c87e52"/>

    <!-- Face -->
    <ellipse cx="100" cy="100" rx="47" ry="55" fill="#d4906a"/>

    <!-- Hair top cap -->
    <ellipse cx="100" cy="56" rx="47" ry="20" fill="#1e0f08"/>
    <!-- Hair forehead curve -->
    <path d="M53 78 Q52 48 100 44 Q148 48 147 78 Q142 55 100 52 Q58 55 53 78Z" fill="#1e0f08"/>

    <!-- Ears -->
    <ellipse cx="53" cy="100" rx="8" ry="11" fill="#be7248"/>
    <ellipse cx="147" cy="100" rx="8" ry="11" fill="#be7248"/>
    <ellipse cx="53" cy="100" rx="4" ry="6" fill="#a85e38" opacity="0.5"/>
    <ellipse cx="147" cy="100" rx="4" ry="6" fill="#a85e38" opacity="0.5"/>

    <!-- Eyebrows — thick, masculine -->
    <path d="M66 83 Q78 76 92 81" stroke="#1e0f08" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M108 81 Q122 76 134 83" stroke="#1e0f08" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Eye whites -->
    <ellipse cx="80" cy="96" rx="11" ry="8.5" fill="#f0ede8"/>
    <ellipse cx="120" cy="96" rx="11" ry="8.5" fill="#f0ede8"/>
    <!-- Iris dark brown -->
    <circle cx="80" cy="97" r="6.5" fill="#3a2010"/>
    <circle cx="120" cy="97" r="6.5" fill="#3a2010"/>
    <!-- Pupils -->
    <circle cx="80" cy="97" r="3.8" fill="#0d0d0d"/>
    <circle cx="120" cy="97" r="3.8" fill="#0d0d0d"/>
    <!-- Shine -->
    <circle cx="83" cy="94" r="2" fill="white" opacity="0.8"/>
    <circle cx="123" cy="94" r="2" fill="white" opacity="0.8"/>
    <!-- Eyelid line top -->
    <path d="M69 91 Q80 85 91 91" stroke="#1e0f08" stroke-width="1.8" fill="none"/>
    <path d="M109 91 Q120 85 131 91" stroke="#1e0f08" stroke-width="1.8" fill="none"/>

    <!-- Nose bridge + tip -->
    <path d="M97 108 Q92 120 95 126 Q100 131 105 126 Q108 120 103 108" stroke="#aa6640" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Nostrils subtle -->
    <ellipse cx="95" cy="126" rx="4" ry="3" fill="#b06848" opacity="0.5"/>
    <ellipse cx="105" cy="126" rx="4" ry="3" fill="#b06848" opacity="0.5"/>

    <!-- Upper lip -->
    <path d="M88 132 Q95 129 100 132 Q105 129 112 132" stroke="#985030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M87 137 Q100 146 113 137" stroke="#884828" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Beard — full coverage -->
    <path d="M63 118 Q60 142 67 157 Q78 168 100 170 Q122 168 133 157 Q140 142 137 118 Q124 132 100 134 Q76 132 63 118Z" fill="#1e0f08" opacity="0.6"/>
    <!-- Mustache -->
    <path d="M87 132 Q100 137 113 132 Q104 139 100 136 Q96 139 87 132Z" fill="#1e0f08" opacity="0.65"/>
    <!-- Sideburns -->
    <path d="M53 90 Q49 108 51 122 Q55 134 63 134 Q56 118 58 95Z" fill="#1e0f08" opacity="0.7"/>
    <path d="M147 90 Q151 108 149 122 Q145 134 137 134 Q144 118 142 95Z" fill="#1e0f08" opacity="0.7"/>

    <!-- Hair strand highlights -->
    <path d="M44 148 Q40 178 44 218" stroke="#2e1810" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M50 148 Q47 175 50 218" stroke="#2e1810" stroke-width="2.5" fill="none" opacity="0.4"/>
    <path d="M156 148 Q160 178 156 218" stroke="#2e1810" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M150 148 Q153 175 150 218" stroke="#2e1810" stroke-width="2.5" fill="none" opacity="0.4"/>

    <!-- Green terminal border glow bottom -->
    <rect x="0" y="232" width="200" height="8" fill="#00ff41" opacity="0.06"/>

    <!-- Green dot status -->
    <circle cx="175" cy="220" r="5" fill="#00ff41" opacity="0.8"/>
    <circle cx="175" cy="220" r="8" fill="#00ff41" opacity="0.15"/>
  </g>
</svg>
